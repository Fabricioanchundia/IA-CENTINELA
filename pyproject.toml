[project]
name = "centinela"
version = "0.10.0"
description = "AI SRE agent that detects, diagnoses and safely fixes incidents in a microservices app."
readme = "README.md"
license = "MIT"
authors = [{ name = "Fabricio Anchundia" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "mcp>=2.3.0",
    "prometheus-client>=0.26",
    "psycopg[binary,pool]>=3.3.8",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38",
]

[project.scripts]
centinela = "centinela.cli:main"

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.uv.workspace]
members = ["apps/shop"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps/shop/src", "apps/shop/tests"]

[tool.ruff.lint]
# E/F/W: errors, I: imports, B: bugbear, UP: modern syntax, S: bandit (security), N: naming
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]  # assert and seeded random are fine in tests
"src/centinela/site.py" = ["E501"]  # HTML templates: long lines are the markup
"src/centinela/site_player.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps/shop/src"]
packages = ["centinela", "shop"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/shop/tests"]
addopts = "-q --import-mode=importlib --cov=centinela --cov=shop --cov-report=term-missing"
