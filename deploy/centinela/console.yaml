# Approval console (Phase 7b): a web page where a human approves or rejects the agent's
# actions. No Kubernetes permissions (no token mounted), connects to PostgreSQL as
# `centinela_console`, which can only record decisions. Not exposed outside the cluster:
# reach it with `./scripts/k8s.sh console` (port-forward to http://localhost:8400).
apiVersion: v1
kind: Service
metadata:
  name: centinela-console
spec:
  selector:
    app.kubernetes.io/name: centinela-console
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centinela-console
  labels:
    app.kubernetes.io/name: centinela-console
spec:
  replicas: 1 # the login throttle lives in memory: one replica
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: centinela-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centinela-console
    spec:
      automountServiceAccountToken: false # no Kubernetes API access at all
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: centinela-agent:dev
          imagePullPolicy: IfNotPresent # imported with `k3d image import`
          command: ["centinela", "console"]
          env:
            - name: PGHOST
              value: incidents-db
            - name: CONSOLE_SECURE_COOKIES
              value: "false" # plain HTTP through port-forward; "true" behind HTTPS (Phase 10)
          envFrom:
            - secretRef:
                name: console-credentials # login, session key, restricted DB role
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 250m, memory: 160Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
