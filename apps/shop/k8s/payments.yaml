apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30803 # host port via deploy/k3d/cluster.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: shop-service
spec:
  replicas: 1
  revisionHistoryLimit: 5 # keeps old ReplicaSets so a rollback is possible (Phase 7)
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/component: shop-service
      annotations:
        prometheus.io/scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # "app" user created in apps/shop/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 16Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: payments
          image: centinela-shop:dev
          imagePullPolicy: IfNotPresent # imported with `k3d image import`, never pulled
          command: ["uvicorn", "shop.payments:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: postgres-credentials
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            # Zero-downtime rollouts: keep serving for 5 s while Kubernetes removes this pod
            # from the Service endpoints, then shut down (incident 6, ADR-0008).
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
