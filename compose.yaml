# Centinela local stack.
#
#   Shop only (~700 MB cap):          docker compose up -d --build
#   Shop + observability (~1.9 GB):   docker compose --profile obs up -d --build
#   Checks:                           ./scripts/smoke.sh && ./scripts/smoke-obs.sh
#   Stop everything, free memory:     docker compose --profile obs down
#
# First time only: cp .env.example .env   (see docs/adr/0002, 0003 and 0004)

name: centinela

x-shop-service: &shop-service
  build:
    context: .
    dockerfile: apps/shop/Dockerfile
  image: centinela-shop:dev
  restart: unless-stopped
  environment:
    # Standard libpq variables: the password stays a separate secret, never inside a URL
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER:-shop}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB:-shop}
    REDIS_URL: redis://redis:6379/0
    CATALOG_URL: http://catalog:8000
    PAYMENTS_URL: http://payments:8000
  mem_limit: 128m
  cpus: 0.5
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    <<: *shop-service
    command: ["uvicorn", "shop.catalog:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  payments:
    <<: *shop-service
    command: ["uvicorn", "shop.payments:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres: { condition: service_healthy }

  orders:
    <<: *shop-service
    command: ["uvicorn", "shop.orders:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres: { condition: service_healthy }
      catalog: { condition: service_healthy }
      payments: { condition: service_healthy }

  # ---------------------------------------------------------------------------------------
  # Observability (profile "obs"): metrics, logs, dashboards and steady background traffic
  # ---------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    cpus: 0.5

  loki:
    image: grafana/loki:3.7.9
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki:/etc/loki:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 256m
    cpus: 0.5

  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 192m
    cpus: 0.25
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop-overview.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      - prometheus
      - loki

  loadgen:
    build:
      context: .
      dockerfile: apps/shop/Dockerfile
    image: centinela-shop:dev
    profiles: ["obs"]
    restart: unless-stopped
    command: ["python", "-m", "shop.loadgen"]
    environment:
      ORDERS_URL: http://orders:8000
      CATALOG_URL: http://catalog:8000
      LOADGEN_RPS: ${LOADGEN_RPS:-2}
    mem_limit: 96m
    cpus: 0.25
    depends_on:
      orders: { condition: service_healthy }

volumes:
  pgdata:
  promdata:
  lokidata:
  grafanadata:
