# Container images (Phase 10): build, scan, publish with an SBOM and provenance, sign.
#
# Pull requests: build and scan only. main and version tags: also publish to GitHub Packages
# (ghcr.io), with a software bill of materials (SBOM) and build provenance attached, and sign
# the image with Sigstore cosign (keyless: the signature proves it was built by this workflow
# in this repository). Verify with the command printed in the job summary.
name: images

on:
  pull_request:
    paths:
      - Dockerfile
      - apps/shop/Dockerfile
      - src/**
      - apps/shop/src/**
      - docs/runbooks/**
      - pyproject.toml
      - apps/shop/pyproject.toml
      - uv.lock
      - .github/workflows/images.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publish to ghcr.io (not used on pull requests)
      id-token: write # keyless signing with Sigstore
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: centinela-agent
            dockerfile: Dockerfile
          - image: centinela-shop
            dockerfile: apps/shop/Dockerfile
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      TRIVY_VERSION: 0.76.2
    steps:
      - uses: actions/checkout@v7

      - name: Image name (ghcr.io needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build for scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Vulnerability scan (Trivy) - fails on fixable CRITICAL
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache" "aquasec/trivy:${TRIVY_VERSION}" "$@"
          }
          trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --format table \
            "${{ matrix.image }}:scan" | tee trivy.txt
          trivy image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ matrix.image }}:scan" >/dev/null
          {
            echo "### ${{ matrix.image }}: vulnerabilities with a fix available (HIGH, CRITICAL)"
            echo '```'; tail -n 40 trivy.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Packages
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (with SBOM and provenance)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@v4.1.3
        if: env.PUBLISH == 'true'

      - name: Sign (keyless, Sigstore)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "### ${{ matrix.image }} published and signed"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
