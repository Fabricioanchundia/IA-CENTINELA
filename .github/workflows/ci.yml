name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff (lint + security rules)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict types)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Gitleaks (via pre-commit)
        run: uvx pre-commit run gitleaks --all-files

  shop-image:
    name: shop image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the shop image
        run: docker build -f apps/shop/Dockerfile -t centinela-shop:ci .
      - name: Image size
        run: docker image ls centinela-shop:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q

  observability:
    name: observability config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
      - name: Prometheus config for Kubernetes
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 check config --syntax-only /etc/prometheus/prometheus-k8s.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v3.16.0 test rules tests/alerts_test.yml
      - name: Loki config
        run: |
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro" \
            grafana/loki:3.7.9 -config.file=/etc/loki/loki.yaml -verify-config
      - name: Alloy configs
        run: |
          for f in config.alloy config-k8s.alloy; do
            docker run --rm -v "$PWD/observability/alloy:/etc/alloy:ro" grafana/alloy:v1.21.3 fmt "/etc/alloy/$f"
          done
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool observability/grafana/dashboards/shop-overview.json > /dev/null
      - name: Compose file with all profiles
        run: cp .env.example .env && docker compose --profile obs config -q

  kubernetes:
    name: kubernetes and terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.8.3
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - name: Kubernetes manifests (strict schema validation)
        run: kustomize build deploy/k8s | kubeconform -strict -summary -kubernetes-version 1.37.0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
