name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff (lint + security rules)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict types)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Gitleaks (via pre-commit)
        run: uvx pre-commit run gitleaks --all-files

  shop-image:
    name: shop image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the shop image
        run: docker build -f apps/shop/Dockerfile -t centinela-shop:ci .
      - name: Image size
        run: docker image ls centinela-shop:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
