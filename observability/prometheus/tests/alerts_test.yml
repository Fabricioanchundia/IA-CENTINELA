# Unit tests for the alert rules:  promtool test rules observability/prometheus/tests/alerts_test.yml
rule_files:
  - ../alerts.yml

evaluation_interval: 15s

tests:
  - name: payments goes down
    interval: 15s
    input_series:
      - series: 'up{job="shop", service="payments", instance="payments:8000"}'
        values: "1 1 0x8"
    alert_rule_test:
      - eval_time: 45s
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: shop
              service: payments
            exp_annotations:
              summary: "payments is down"
              description: "Prometheus has had no healthy payments target for more than 1 minute (crashed, or no pods running)."
              runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/service-down.md"

  - name: a new pod still starting during a rollout is not an outage (incident 8)
    interval: 15s
    input_series:
      # the old pod keeps serving the whole time
      - series: 'up{job="shop", service="payments", instance="10.42.0.7:8000"}'
        values: "1x20"
      # the new pod is discovered before it listens: up == 0 for 3 minutes
      - series: 'up{job="shop", service="payments", instance="10.42.0.9:8000"}'
        values: "0x12 1x8"
    alert_rule_test:
      - eval_time: 2m30s
        alertname: ServiceDown
        exp_alerts: []

  - name: payments scaled to 0 (the target disappears, up never becomes 0)
    interval: 15s
    input_series:
      - series: 'up{job="shop", service="payments", instance="10.42.0.7:8000"}'
        values: "1 1 stale"
      - series: 'up{job="shop", service="orders", instance="10.42.0.8:8000"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 45s
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: shop
              service: payments
            exp_annotations:
              summary: "payments is down"
              description: "Prometheus has had no healthy payments target for more than 1 minute (crashed, or no pods running)."
              runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/service-down.md"

  - name: a rolling restart (new pod, new instance) does not alert
    interval: 15s
    input_series:
      - series: 'up{job="shop", service="catalog", instance="10.42.0.5:8000"}'
        values: "1 1 1 1 stale"
      - series: 'up{job="shop", service="catalog", instance="10.42.0.9:8000"}'
        values: "_ _ _ 1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts: []

  - name: orders returns 10% errors
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="shop", service="orders", method="POST", route="/orders", status="201"}'
        values: "0+9x40"
      - series: 'http_requests_total{job="shop", service="orders", method="POST", route="/orders", status="503"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 6m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: orders
            exp_annotations:
              summary: "orders returns too many 5xx errors"
              description: "10% of requests to orders fail with 5xx (threshold 5%)."
              runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/high-error-rate.md"

  - name: healthy traffic does not alert
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="shop", service="catalog", method="GET", route="/products", status="200"}'
        values: "0+10x40"
      - series: 'up{job="shop", service="catalog", instance="catalog:8000"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 6m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts: []

  - name: a few errors during a rollout do not page, a failing dependency does
    interval: 15s
    input_series:
      # 5 failed calls in one scrape (a rollout blip), then nothing
      - series: 'shop_upstream_errors_total{job="shop", service="orders", upstream="catalog"}'
        values: "0 0 5x20"
      # payments down: ~1.5 failed calls per second
      - series: 'shop_upstream_errors_total{job="shop", service="orders", upstream="payments"}'
        values: "0+22x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: UpstreamErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              upstream: payments
            exp_annotations:
              summary: "orders cannot reach payments"
              description: "orders is failing calls to payments (1.47 errors/s)."
              runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/upstream-errors.md"
