# Alert rules evaluated by Prometheus. Centinela (Phase 6+) reads firing alerts from
# the Prometheus API, so no Alertmanager is needed yet (saves memory).
groups:
  - name: shop
    rules:
      - alert: ServiceDown
        # Two ways a service is down:
        # 1. its target answers badly: up == 0 (Compose, crashed pod)
        # 2. it has NO target at all: every pod is gone (scaled to 0, deleted), so Kubernetes
        #    discovery drops it and `up` disappears instead of becoming 0. Catch services seen
        #    in the last hour that have no `up` series now (ADR-0006).
        expr: |
          up{job="shop"} == 0
            or
          (max by (job, service) (max_over_time(up{job="shop"}[1h])) unless on (service) up{job="shop"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus has had no healthy {{ $labels.service }} target for more than 1 minute (crashed, or no pods running)."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/service-down.md"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{job="shop", status=~"5.."}[2m]))
            /
          sum by (service) (rate(http_requests_total{job="shop"}[2m]))
            > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} returns too many 5xx errors"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.service }} fail with 5xx (threshold 5%)."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/high-error-rate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket{job="shop"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is slow"
          description: "p95 latency of {{ $labels.service }} is {{ $value | humanizeDuration }} (threshold 500ms)."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/high-latency.md"

      - alert: UpstreamErrors
        # > 0.1/s (6+ failed calls a minute): a dependency is really failing. A handful of
        # errors during a rollout must not page anyone (incident 6, ADR-0008).
        expr: sum by (upstream) (rate(shop_upstream_errors_total{job="shop"}[2m])) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "orders cannot reach {{ $labels.upstream }}"
          description: "orders is failing calls to {{ $labels.upstream }} ({{ $value | printf \"%.2f\" }} errors/s)."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/upstream-errors.md"

      - alert: CacheDegraded
        expr: sum(rate(shop_cache_requests_total{job="shop", result="error"}[2m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "catalog cache (Redis) is failing"
          description: "catalog is serving from PostgreSQL because Redis lookups fail."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/cache-degraded.md"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="shop"} > 100 * 1024 * 1024
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} uses too much memory"
          description: "{{ $labels.service }} uses {{ $value | humanize1024 }}B of its 128MiB limit."
          runbook_url: "https://github.com/Fabricioanchundia/IA-CENTINELA/blob/main/docs/runbooks/high-memory.md"
