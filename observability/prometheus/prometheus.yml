# Prometheus for Centinela. Short retention on purpose: this runs on a 16 GB laptop.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shop
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8000"]
        labels: { service: catalog }
      - targets: ["orders:8000"]
        labels: { service: orders }
      - targets: ["payments:8000"]
        labels: { service: payments }

  - job_name: observability
    static_configs:
      - targets: ["localhost:9090"]
        labels: { service: prometheus }
      - targets: ["loki:3100"]
        labels: { service: loki }
      - targets: ["alloy:12345"]
        labels: { service: alloy }
      - targets: ["grafana:3000"]
        labels: { service: grafana }
